<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071221;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#ef4444" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#06b6d4" opacity="0.1"/>
  
  <!-- Main content area -->
  <rect x="60" y="60" width="1080" height="510" rx="30" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Logo/Icon area -->
  <circle cx="200" cy="200" r="80" fill="url(#accent-gradient)"/>
  <path d="M170 200 L230 200 M200 170 L200 230" stroke="white" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Title -->
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    StreamNest
  </text>
  
  <!-- Subtitle -->
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">
    Desktop Media Downloader
  </text>
  
  <!-- Description -->
  <text x="320" y="320" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1">
    Download videos, audio, and playlists
  </text>
  <text x="320" y="360" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1">
    from 1000+ sites. Free & open-source.
  </text>
  
  <!-- Features -->
  <text x="320" y="440" font-family="Arial, sans-serif" font-size="20" fill="#06b6d4">
    ✓ MP4 & MP3 Support
  </text>
  <text x="320" y="480" font-family="Arial, sans-serif" font-size="20" fill="#06b6d4">
    ✓ Playlist Downloads
  </text>
  <text x="320" y="520" font-family="Arial, sans-serif" font-size="20" fill="#06b6d4">
    ✓ Cross-Platform
  </text>
  
  <!-- CTA -->
  <rect x="800" y="400" width="280" height="60" rx="30" fill="url(#accent-gradient)"/>
  <text x="940" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Download Free
  </text>
  
  <!-- Footer -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">
    streamnest-puce.vercel.app
  </text>
</svg>
